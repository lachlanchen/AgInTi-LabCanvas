<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows App View</title>
<style>
* { box-sizing: border-box; letter-spacing: 0; }
body { margin:0; background:#16191c; color:#edf0f3; font:14px system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; }
header { min-height:46px; padding:6px 12px; display:flex; flex-wrap:wrap; align-items:center; gap:12px; border-bottom:1px solid #42474c; }
strong { margin-right:auto; } a { color:#9ddcc9; } button { font:inherit; padding:5px 10px; cursor:pointer; }
#status { color:#bbc2ca; } #screen { flex:1; min-height:0; overflow:hidden; }
dialog { width:min(620px,94vw); max-height:90dvh; border:1px solid #60666b; border-radius:12px; padding:20px; overflow:auto; }
dialog::backdrop { background:#0008; } dialog h2 { margin:0 0 10px; font-size:20px; }
dialog p { line-height:1.5; } textarea { width:100%; height:180px; resize:vertical; font:16px/1.5 system-ui,sans-serif; }
.clip-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.clip-actions button { min-height:42px; } #clip-status { min-height:1.5em; margin-bottom:0; }
</style>
<header><strong id="name"></strong><span id="status">Connecting</span><button id="control">Take control</button><button id="clipboard" disabled>Clipboard</button><a href="http://127.0.0.1:6143/" target="_blank" rel="noopener">VM console</a></header>
<main id="screen"></main>
<dialog id="clip" aria-labelledby="clip-title">
<h2 id="clip-title">Clipboard</h2>
<p>Move text between this browser's device and Windows. Sending changes the Windows clipboard; paste it in the app when ready.</p>
<textarea aria-label="Clipboard text" maxlength="65536" spellcheck="false"></textarea>
<div class="clip-actions"><button id="copy-local">Copy to this device</button><button id="read-local">Paste from this device</button><button id="paste">Send to Windows clipboard</button><button id="reload-clip">Reload Windows clipboard</button><button id="close">Close</button></div>
<p id="clip-status" role="status" aria-live="polite"></p>
</dialog>
<script type="module">
import RFB from '/novnc/core/rfb.js';
const name = location.pathname.slice(1);
const title = name === 'wecom' ? 'WeCom' : 'WeChat';
document.title = `${title} | Tiny11`;
document.querySelector('#name').textContent = title;
const status = document.querySelector('#status');
const control = document.querySelector('#control');
const clipboard = document.querySelector('#clipboard');
const clip = document.querySelector('#clip');
let rfb, generation = 0, controlling = false, activity = Date.now(), reconnect;
let lease = '';
function connect(wantControl = false) {
    clearTimeout(reconnect);
    const current = ++generation;
    if (rfb) rfb.disconnect();
    controlling = false;
    clipboard.disabled = true;
    control.disabled = true;
    status.textContent = wantControl ? 'Requesting control' : 'Connecting';
    lease = wantControl ? crypto.randomUUID() : '';
    rfb = new RFB(document.querySelector('#screen'), `ws://${location.host}/ws/${name}?control=${wantControl ? 1 : 0}&lease=${lease}`, {shared:true});
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.viewOnly = !wantControl;
    rfb.addEventListener('connect', () => {
        if (current !== generation) return;
        controlling = wantControl;
        activity = Date.now();
        status.textContent = controlling ? 'You have control' : 'Viewing';
        control.textContent = controlling ? 'Release control' : 'Take control';
        control.disabled = false;
        clipboard.disabled = !controlling;
    });
    rfb.addEventListener('disconnect', () => {
        if (current !== generation) return;
        controlling = false;
        control.disabled = true;
        clipboard.disabled = true;
        status.textContent = wantControl ? 'Input busy or disconnected; returning to view' : 'Reconnecting';
        reconnect = setTimeout(() => connect(false), 1500);
    });
}
control.onclick = () => connect(!controlling);
async function clipboardRequest(action, text) {
    const response = await fetch('/clipboard', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lease,action,text})});
    if (!response.ok) throw new Error('Clipboard unavailable; check control status');
    return response.json();
}
const clipText = clip.querySelector('textarea');
const clipStatus = document.querySelector('#clip-status');
const clipButtons = [...clip.querySelectorAll('button')].filter(button => button.id !== 'close');
let clipboardBusy = false, clipboardDraft = false;
clipText.addEventListener('input', () => { clipboardDraft = true; });
function busy(value) {
    clipboardBusy = value;
    clipButtons.forEach(button => { button.disabled = value; });
}
async function readWindowsClipboard() {
    if (clipboardBusy) return;
    busy(true);
    try {
        if (!controlling) throw new Error('Take control again before reading the Windows clipboard.');
        const data = await clipboardRequest('read');
        if (typeof data.text !== 'string') throw new Error('Windows did not return text.');
        clipText.value = data.text;
        clipboardDraft = false;
        clipStatus.textContent = 'Windows clipboard loaded. Choose Copy to this device to copy it here.';
    } catch(e) { clipStatus.textContent = e.message; }
    finally { busy(false); }
}
clipboard.onclick = () => {
    if (!clip.open) clip.showModal();
    if (clipboardDraft) clipStatus.textContent = 'Your draft is kept. Send it to Windows, or choose Reload Windows clipboard to replace it.';
    else readWindowsClipboard();
};
document.querySelector('#reload-clip').onclick = readWindowsClipboard;
document.querySelector('#close').onclick = () => clip.close();
document.querySelector('#copy-local').onclick = async () => {
    // A separate user click keeps Safari/mobile clipboard access inside a
    // user gesture; no async network request precedes this write.
    try {
        if (!navigator.clipboard?.writeText) throw new Error('Use manual copy');
        await navigator.clipboard.writeText(clipText.value);
        clipStatus.textContent = 'Copied to this device.';
    } catch {
        clipText.focus(); clipText.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch {}
        clipStatus.textContent = copied ? 'Copied to this device.' : 'Text selected. Use Copy or long-press and Copy on your phone.';
    }
};
document.querySelector('#read-local').onclick = async () => {
    try {
        if (!navigator.clipboard?.readText) throw new Error('Use manual paste');
        const text = await navigator.clipboard.readText();
        if (text.length > 65536) { clipStatus.textContent = 'Text exceeds the 65,536-character limit.'; return; }
        clipText.value = text;
        clipboardDraft = true;
        clipStatus.textContent = 'Text loaded from this device. Review it, then choose Send to Windows clipboard.';
    } catch {
        clipText.focus();
        clipStatus.textContent = 'Paste into the text box using your keyboard or long-press Paste. Then choose Send to Windows clipboard.';
    }
};
document.querySelector('#paste').onclick = async () => {
    if (clipboardBusy) return;
    busy(true);
    try {
        if (!controlling) throw new Error('Control was released. Your text is kept here; take control again before sending.');
        await clipboardRequest('write',clipText.value);
        clipboardDraft = false;
        clipStatus.textContent = 'Windows clipboard updated. Paste in Windows when ready.';
    } catch(e) { clipStatus.textContent=e.message; }
    finally { busy(false); }
};
for (const event of ['pointerdown','pointermove','keydown','wheel']) document.addEventListener(event, () => { activity = Date.now(); }, {capture:true,passive:true});
setInterval(() => { if (controlling && Date.now()-activity > 90000) connect(false); }, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden && controlling) connect(false); });
window.addEventListener('pagehide', () => { generation++; clearTimeout(reconnect); rfb?.disconnect(); });
connect();
</script>
</html>
